name: Preserve decay71 history and prepare isolated feeder patch

on:
  push:
    branches:
      - release/paxx20-all-in-one
    paths:
      - .github/workflows/upstream-lineage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-lineage-v127b
  cancel-in-progress: false

jobs:
  preserve-upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Enhanced snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify original upstream commit and isolate replenishment change
        shell: bash
        run: |
          set -euo pipefail
          # Do not alter main or any public release.
          expected=a1a7b91b1fd297c1486a13ea22c61e01499a196d
          src="$GITHUB_WORKSPACE/klipper/extras/filament_feed_ace.py"
          test -s "$src"
          grep -q "REPLENISH" "$src"
          git fetch --no-tags https://github.com/decay71/multiACE.git refs/tags/v1.27b
          upstream_commit="$(git rev-parse FETCH_HEAD)"
          test "$upstream_commit" = "$expected"
          test "$(git cat-file -t "$upstream_commit")" = commit
          # Preserve actual upstream parent chain, original authors, dates, and messages.
          for branch in history/decay71-v1.27b review/replenish-v1.27b; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              echo "::error::Branch $branch already exists; refusing to overwrite history."
              exit 1
            fi
          done
          git push origin "$upstream_commit:refs/heads/history/decay71-v1.27b"
          git switch --detach "$upstream_commit"
          git switch -c review/replenish-v1.27b
          dst=multiace/klipper/extras/filament_feed_ace.py
          test -s "$dst"
          cp "$src" "$dst"
          git add -- "$dst"
          git diff --cached --check
          git diff --cached --stat
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached -- "$dst"
          git -c user.name=atikturk -c user.email=92893355+atikturk@users.noreply.github.com \
            commit -m "Enhanced: narrow in-print Auto Replenish feeder guard" \
                   -m "Derived from decay71 multiACE v1.27b, retaining full upstream author history. This patch adds the REPLENISH argument and PRELOAD_FINISH guard only."
          git push origin HEAD:refs/heads/review/replenish-v1.27b
          echo "Original decay71 history and an isolated review branch created." >> "$GITHUB_STEP_SUMMARY"
          echo "Base commit: $upstream_commit" >> "$GITHUB_STEP_SUMMARY"
          echo "Compare: https://github.com/atikturk/multiace-enhanced/compare/history/decay71-v1.27b...review/replenish-v1.27b" >> "$GITHUB_STEP_SUMMARY"
