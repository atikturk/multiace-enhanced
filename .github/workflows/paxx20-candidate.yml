name: PAXX 2.0 Enhanced candidate build (NOT FOR INSTALL)

on:
  push:
    branches:
      - release/paxx20-all-in-one
    paths:
      - 'packaging/paxx20/**'
      - 'firmware/**'
      - '.github/workflows/paxx20-candidate.yml'
  workflow_dispatch:

# One candidate build per change, not duplicate push + draft-PR builds.
concurrency:
  group: paxx20-enhanced-candidate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-source-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: '1'
    steps:
      - name: Checkout Enhanced repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Fail fast on broken init scripts before spending minutes repacking
      # a complete USB image. This caught the malformed S58 in run #45.
      - name: Validate first-boot init and QA shell syntax
        run: |
          set -euo pipefail
          sh -n firmware/init.d/S58multiace-mode
          sh -n packaging/paxx20/S99spoolman
          bash -n packaging/paxx20/qa_first_boot.sh
          bash -n packaging/paxx20/qa_spoolman_smoke.sh
          echo "First-boot shell syntax validated"

      - name: Prepare disk for firmware build
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/local/share/powershell
          df -h .

      # PAXX's builder chroots into a Snapmaker ARM64 rootfs to install
      # Python packages. An x86_64 GitHub runner needs binfmt_misc + QEMU.
      - name: Enable ARM64 emulation for PAXX firmware chroot
        run: |
          set -euo pipefail
          docker run --rm --privileged tonistiigi/binfmt --install arm64
          test -r /proc/sys/fs/binfmt_misc/qemu-aarch64
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -Eq '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
          docker run --rm --platform linux/arm64 arm64v8/alpine:3.21 uname -m | grep -qx aarch64

      - name: Checkout pinned upstream sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          git clone --depth 1 --recurse-submodules --branch v2.0.0-paxx12-24 \
            https://github.com/paxx12-snapmaker-u1/SnapmakerU1-Extended-Firmware.git \
            "$RUNNER_TEMP/sources/paxx"
          git clone --depth 1 --branch v1.27b \
            https://github.com/decay71/multiACE.git "$RUNNER_TEMP/sources/multiace"
          git clone --depth 1 --branch v0.27.1 \
            https://github.com/Donkie/Spoolman.git "$RUNNER_TEMP/sources/spoolman"
          git -C "$RUNNER_TEMP/sources/paxx" rev-parse HEAD
          git -C "$RUNNER_TEMP/sources/multiace" rev-parse HEAD
          git -C "$RUNNER_TEMP/sources/spoolman" rev-parse HEAD

      - name: Set up Node 24 for Spoolman v0.27.1 Svelte client
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build pinned Spoolman Svelte Web client for offline firmware
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sources/spoolman/client_v2"
          node --version
          npm ci
          npm run build
          test -s build/200.html

      # The React UI is the familiar Spoolman interface used before v0.26.
      # Build BOTH clients so either can be selected without internet/pip/npm
      # on the U1. Only the newer Svelte client is the upstream default.
      - name: Build pinned Spoolman legacy React Web client for offline firmware
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sources/spoolman/client"
          npm ci
          # Vite embeds this in the legacy React assets at BUILD time.
          # Relative URL works for every printer IP and avoids CORS.
          export VITE_APIURL=/api/v1
          npm run build
          test -s dist/index.html
          test -d dist/assets
          grep -R -Fq '/api/v1' dist/assets
          if grep -R -Fq 'Missing API URL' dist/assets; then
            echo "FAIL: legacy Spoolman React client still shows Missing API URL" >&2
            exit 1
          fi
          echo "Legacy Spoolman client: API base /api/v1 embedded"

      - name: Prepare source-only firmware overlay
        run: |
          set -euo pipefail
          python3 packaging/paxx20/stage_overlay.py \
            --paxx "$RUNNER_TEMP/sources/paxx" \
            --enhanced "$GITHUB_WORKSPACE" \
            --multiace "$RUNNER_TEMP/sources/multiace" \
            --spoolman "$RUNNER_TEMP/sources/spoolman" \
            --out "$RUNNER_TEMP/enhanced-overlay"
          python3 packaging/paxx20/finalize_overlay.py \
            --out "$RUNNER_TEMP/enhanced-overlay" \
            --repo "$GITHUB_WORKSPACE"
          cp -a "$RUNNER_TEMP/enhanced-overlay/overlays/mods/enhanced" \
                "$RUNNER_TEMP/sources/paxx/overlays/mods/enhanced"
          test -f "$RUNNER_TEMP/enhanced-overlay/NOT_FLASHABLE.txt"

      - name: Build offline-inspection candidate using PAXX builder
        working-directory: ${{ runner.temp }}/sources/paxx
        run: |
          set -euo pipefail
          chmod +x dev.sh
          ./dev.sh make build PROFILE=extended-enhanced \
            OUTPUT_FILE=firmware/U1_extended-enhanced-DEV-NOT-FOR-PRINTER.bin

      - name: Smoke-test PAXX first-boot ACE config and normal-mode backup
        run: |
          set -euo pipefail
          bash packaging/paxx20/qa_first_boot.sh \
            "$RUNNER_TEMP/sources/paxx/tmp/firmware/rootfs" \
            | tee "$RUNNER_TEMP/first-boot-smoke.log"

      - name: Smoke-test bundled Spoolman HTTP API and restart under ARM64
        run: |
          set -euo pipefail
          bash packaging/paxx20/qa_spoolman_smoke.sh \
            "$RUNNER_TEMP/sources/paxx/tmp/firmware/rootfs"

      - name: Record checksum and size, do NOT publish firmware binary
        if: success()
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/sources/paxx/firmware/U1_extended-enhanced-DEV-NOT-FOR-PRINTER.bin"
          test -s "$f"
          rootfs="$RUNNER_TEMP/sources/paxx/tmp/firmware/rk-unpacked/rootfs.img"
          test -s "$rootfs"
          max_rootfs_bytes=$((614400 * 512))
          actual_rootfs_bytes="$(stat -c '%s' "$rootfs")"
          printf 'rootfs bytes: %s / %s partition limit\n' "$actual_rootfs_bytes" "$max_rootfs_bytes"
          test "$actual_rootfs_bytes" -le "$max_rootfs_bytes"
          mkdir -p "$RUNNER_TEMP/candidate-report"
          sha256sum "$f" > "$RUNNER_TEMP/candidate-report/sha256.txt"
          wc -c "$f" > "$RUNNER_TEMP/candidate-report/size.txt"
          cp "$RUNNER_TEMP/enhanced-overlay/STAGING_MANIFEST.json" "$RUNNER_TEMP/candidate-report/"
          cp "$RUNNER_TEMP/sources/paxx/tmp/firmware/TTC_COMPARISON.json" "$RUNNER_TEMP/candidate-report/"
          cp "$RUNNER_TEMP/sources/paxx/tmp/firmware/TTC_DIFF.patch" "$RUNNER_TEMP/candidate-report/"
          cp "$RUNNER_TEMP/first-boot-smoke.log" "$RUNNER_TEMP/candidate-report/"
          test -s "$RUNNER_TEMP/sources/paxx/tmp/firmware/rootfs/etc/init.d/S99spoolman"
          test -f "$RUNNER_TEMP/sources/paxx/tmp/firmware/rootfs/home/lava/spoolman/.vendor/uvicorn/__init__.py"
          test -f "$RUNNER_TEMP/sources/paxx/tmp/firmware/rootfs/home/lava/multiace_web/.vendor/uvicorn/__init__.py"
          test -f "$RUNNER_TEMP/sources/paxx/tmp/firmware/rootfs/usr/local/share/firmware-config/extended/klipper/90_multiace.cfg"
          printf '%s\n' 'NOT A RELEASE: Spoolman service and ARM64 dependencies are now bundled; real clean-install, physical ACE, cold-boot and rollback tests remain mandatory.' > "$RUNNER_TEMP/candidate-report/NOT_FLASHABLE.txt"
          cat "$RUNNER_TEMP/candidate-report/sha256.txt"
          # Keep an image for *supervised hardware acceptance*, not a public
          # release. Its label is intentionally explicit about missing testing.
          mkdir -p "$RUNNER_TEMP/firmware-qa-image"
          sudo cp "$f" "$RUNNER_TEMP/firmware-qa-image/U1_extended-enhanced-HARDWARE-UNTESTED.bin"
          sudo chown "$USER:$USER" "$RUNNER_TEMP/firmware-qa-image/U1_extended-enhanced-HARDWARE-UNTESTED.bin"
          sha256sum "$RUNNER_TEMP/firmware-qa-image/"*.bin > "$RUNNER_TEMP/candidate-report/experimental-image.sha256"
          sudo rm -f -- "$f"

      - name: Upload hardware-UNTESTED firmware image for supervised acceptance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PAXX20-Enhanced-HARDWARE-UNTESTED-DO-NOT-PUBLISH
          path: ${{ runner.temp }}/firmware-qa-image/*.bin
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Upload emulated QA reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paxx20-enhanced-build-QA-NOT-RELEASED
          path: ${{ runner.temp }}/candidate-report/
          retention-days: 14
